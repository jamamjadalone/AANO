name: Build & Publish Beta Release

on:
  push:
    tags:
      - 'v*beta*'     # Matches e.g. v1.1.0-beta.1, v1.0.2-beta
      - 'v*alpha*'

permissions:
  contents: write

jobs:
  # 1. ANDROID APK BUILD (Ubuntu Runner)
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build Android Release APK
        run: ./gradlew :app:assembleRelease
        working-directory: android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  # 2. WINDOWS SETUP INSTALLER BUILD (Windows Runner)
  build-windows:
    name: Build Windows Setup Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pystray

      - name: Restore Google Credentials (If Secret Configured)
        shell: pwsh
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if ($env:GOOGLE_CREDS) {
            $env:GOOGLE_CREDS | Out-File -FilePath "windows\src\google_credentials.json" -Encoding utf8
          }

      - name: Compile PyInstaller & Inno Setup Installer
        shell: pwsh
        run: |
          pyinstaller --clean -y AANO.spec
          python windows\installer\build_installer.py

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            releases\**\*.exe
            dist\**\*.exe

  # 3. CREATE GITHUB BETA PRE-RELEASE
  create-release:
    name: Create GitHub Beta Pre-Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets/

      - name: Publish Beta Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "AANO ${{ github.ref_name }} (Beta)"
          generate_release_notes: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
