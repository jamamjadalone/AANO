name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. ANDROID APK BUILD (Ubuntu Runner with Pre-installed Android SDK)
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build Android Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        working-directory: android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  # 2. WINDOWS SETUP INSTALLER BUILD (Windows Runner)
  build-windows:
    name: Build Windows Setup Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pystray

      - name: Build Windows Installer
        shell: pwsh
        working-directory: windows
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if ($env:GOOGLE_CREDS) {
            $env:GOOGLE_CREDS | Out-File -FilePath "src\google_credentials.json" -Encoding utf8
          } elseif (-not (Test-Path "src\google_credentials.json")) {
            '{}' | Out-File -FilePath "src\google_credentials.json" -Encoding utf8
          }
          pyinstaller --clean -y AANO.spec
          python installer\build_installer.py

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            windows/dist/Installer/*.exe
            releases/**/*.exe
          if-no-files-found: warn

  # 3. PUBLISH GITHUB RELEASE
  create-release:
    name: Publish Release to GitHub
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "AANO ${{ github.ref_name }} (Beta)"
          generate_release_notes: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
