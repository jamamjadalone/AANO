name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. ANDROID APK BUILD (Ubuntu Runner with Pre-installed Android SDK)
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Configure Consistent Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/aano-release.jks
            cat <<EOF > keystore.properties
          storeFile=app/aano-release.jks
          storePassword=aano@2026
          keyAlias=aano
          keyPassword=aano@2026
          EOF
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret not found."
          fi
        working-directory: android

      - name: Build Android Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        working-directory: android

      - name: Rename APK with Tag Version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then VERSION="latest"; fi
          mkdir -p android/release-apk
          cp android/app/build/outputs/apk/release/*.apk "android/release-apk/AANO-${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/release-apk/*.apk

  # 2. WINDOWS SETUP INSTALLER BUILD (Windows Runner)
  build-windows:
    name: Build Windows Setup Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Installer
        shell: pwsh
        working-directory: windows
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if ($env:GOOGLE_CREDS) {
            $env:GOOGLE_CREDS | Out-File -FilePath "src\google_credentials.json" -Encoding utf8
          } elseif (-not (Test-Path "src\google_credentials.json")) {
            '{}' | Out-File -FilePath "src\google_credentials.json" -Encoding utf8
          }
          pyinstaller --clean -y AANO.spec
          python installer\build_installer.py

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            windows/dist/Installer/*.exe
            releases/**/*.exe
          if-no-files-found: warn

  # 3. PUBLISH GITHUB RELEASE
  create-release:
    name: Publish Release to GitHub
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          python3 -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read()
          match = re.search(r'(## \[[^\]]+\].*?)(?=\n## \[|\Z)', text, re.DOTALL)
          notes = match.group(1).strip() if match else 'Release ${{ github.ref_name }}'
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as f:
              f.write(notes)
          "

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "AANO ${{ github.ref_name }} (Beta)"
          body_path: RELEASE_NOTES.md
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
