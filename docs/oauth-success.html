<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AANO Notes — Connected Successfully</title>
  <style>
    :root {
      --brand: #00796B;
      --brand-dark: #004D40;
      --bg: #0F172A;
      --surface: #1E293B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #334155;
      --emerald: #10B981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .check-wrapper {
      width: 72px;
      height: 72px;
      background: rgba(16, 185, 129, 0.12);
      border: 2px solid rgba(16, 185, 129, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px auto;
      color: var(--emerald);
      animation: popCheck 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popCheck {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .badge {
      display: inline-block;
      padding: 5px 14px;
      background: rgba(0, 121, 107, 0.2);
      color: #80CBC4;
      border: 1px solid rgba(0, 121, 107, 0.4);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }
    p {
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .btn-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: var(--brand);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-close:hover {
      background: #00897B;
    }
    .btn-close:active {
      transform: scale(0.98);
    }
    .kbd-tag {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .note-info {
      font-size: 13px;
      color: #64748B;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-wrapper">
      <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <div class="badge">Google Drive Sync</div>
    <h1>Account Connected!</h1>
    <p>Your Google Account has been securely linked to AANO Notes. You can now close this browser tab and return to the application.</p>
    
    <button class="btn-close" id="btnClose" onclick="attemptClose()">
      <span>Close This Tab</span>
      <span class="kbd-tag">Ctrl + W</span>
    </button>
    
    <div class="note-info" id="noteInfo">
      All set! AANO Notes desktop window is now active.
    </div>
  </div>

  <script>
    function attemptClose() {
      // Try modern window close techniques
      try {
        window.open('', '_self', '');
        window.close();
      } catch (e) {}

      // If browser security blocks script-initiated close (standard in Chrome/Edge)
      setTimeout(function() {
        var btn = document.getElementById("btnClose");
        var note = document.getElementById("noteInfo");
        if (btn) {
          btn.innerHTML = '<span>Press <strong>Ctrl + W</strong> to Close Tab</span>';
          btn.style.background = '#1E3A34';
          btn.style.borderColor = '#00796B';
        }
        if (note) {
          note.innerHTML = 'Browser security requires tabs to be closed with <kbd style="background:#334155;padding:2px 6px;border-radius:4px;color:#fff;font-size:11px;">Ctrl + W</kbd>.<br>Your AANO desktop app is ready to use!';
          note.style.color = '#94A3B8';
        }
      }, 200);
    }

    // Try auto-close after 1.5 seconds if permitted by browser
    window.addEventListener('load', function() {
      setTimeout(function() {
        attemptClose();
      }, 1500);
    });
  </script>
</body>
</html>
