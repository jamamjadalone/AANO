<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AANO Notes — Connected Successfully</title>
  <style>
    :root {
      --brand: #00796B;
      --brand-dark: #004D40;
      --bg: #0F172A;
      --surface: #1E293B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #334155;
      --emerald: #10B981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .check-wrapper {
      width: 72px;
      height: 72px;
      background: rgba(16, 185, 129, 0.12);
      border: 2px solid rgba(16, 185, 129, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px auto;
      color: var(--emerald);
      animation: popCheck 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popCheck {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .badge {
      display: inline-block;
      padding: 5px 14px;
      background: rgba(0, 121, 107, 0.2);
      color: #80CBC4;
      border: 1px solid rgba(0, 121, 107, 0.4);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }
    p {
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .btn-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--brand);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-close:hover {
      background: #00897B;
    }
    .btn-close:active {
      transform: scale(0.98);
    }
    .countdown-note {
      font-size: 12.5px;
      color: #64748B;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-wrapper">
      <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <div class="badge">Google Drive Sync</div>
    <h1>Account Connected!</h1>
    <p>Your Google Account has been securely linked to AANO Notes. You can safely close this tab and return to the application.</p>
    <button class="btn-close" onclick="window.close()">Close Window</button>
    <div class="countdown-note" id="countdown">Closing automatically in <span id="sec">3</span>s...</div>
  </div>

  <script>
    let secondsLeft = 3;
    const secEl = document.getElementById("sec");
    const interval = setInterval(() => {
      secondsLeft--;
      if (secEl) secEl.innerText = secondsLeft;
      if (secondsLeft <= 0) {
        clearInterval(interval);
        window.close();
      }
    }, 1000);
  </script>
</body>
</html>
